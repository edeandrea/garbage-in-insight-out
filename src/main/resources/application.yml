quarkus:
  log:
    category:
      "org.apache.pdfbox":
        level: ERROR
      "org.atmosphere":
        level: WARN
      "io.quarkiverse.wiremock":
        level: WARN
      "com.vaadin.flow.server.frontend":
        level: WARN
  langchain4j:
    chat-model:
      provider: openai
    embedding-model:
      provider: openai
    openai:
      base-url: http://localhost:11434/v1
      api-key: none
      chat-model:
        model-name: qwen3:30b-a3b
        temperature: 0
      embedding-model:
        model-name: nomic-embed-text
    pgvector:
      default-store-enabled: false
      naive:
        # Workaround for quarkus-langchain4j#2754 — required for named store discovery
        datasource: "<default>"
        table: naive
        dimension: 768
      docling-naive:
        datasource: "<default>"  # quarkus-langchain4j#2754
        table: docling_naive_chunk
        dimension: 768
      docling-hybrid:
        datasource: "<default>"  # quarkus-langchain4j#2754
        table: docling_hybrid_chunk
        dimension: 768

"%dev":
  quarkus:
    langchain4j:
      chat-model:
        provider: ollama
      embedding-model:
        provider: ollama
      timeout: 60s
      ollama:
        timeout: 60s
        chat-model:
          model-id: qwen3:30b-a3b
        embedding-model:
          model-id: nomic-embed-text

"%test":
  quarkus:
    langchain4j:
      chat-model:
        provider: openai
      embedding-model:
        provider: ollama
      timeout: 60s
      openai:
        base-url: http://localhost:${quarkus.wiremock.devservices.port}/v1
        api-key: none
        chat-model:
          model-name: stub
          temperature: 0
      ollama:
        timeout: 60s
        chat-model:
          model-id: qwen3:30b-a3b
        embedding-model:
          model-id: nomic-embed-text
